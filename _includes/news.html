<!-- News Section -->
<section id="news" class="bg-light-gray">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">LATEST NEWS</h2>
                <!--
                <h3 class="section-subheading text-muted">Reactive news!</h3>
                -->
            </div>
        </div>
        <div id="news-container" class="row" style="text-align: justify;">
            <!-- Aquí se insertarán las noticias dinámicamente -->
        </div>
    </div>
</section>

<script>
    // JSON con las noticias integrado directamente en el HTML
    const news = [
        {
            "date": "29 SEPTEMBER 2025",
            "title": "TAKING 3D SHAPE",
            "image": "img/news/news005.png",
            "text": "The world of Pet.exe is beginning to take shape in three dimensions! We’ve started integrating our first 3D models, giving the game its first real sense of depth and form. Alongside this, we’re bringing sounds into three-dimensional space, so audio now surrounds you as you explore, and we’re implementing 3D player controls for the first time, allowing full interaction with the hybrid world. Each of these steps brings the universe closer to life and we can’t wait to see how players will experience it!"
        }
        ,
        {
            "date": "28 AUGUST 2025",
            "title": "MOTION AWAKENS",
            "image": "img/news/news004.png",
            "text": "The world of Pet.exe is beginning to move! Animations now breathe life into the creature, shaping the way you care for it. We’ve been working on how it looks, how it reacts, and how it responds to the choices you make as a player. Every motion has been crafted frame by frame, paired with sounds carefully designed to match each action. In this game, every interaction with the creature is literally vital — because every detail matters when your survival depends on its mood."
        },
        {
            "date": "11 AUGUST 2025",
            "title": "COME VISIT OUR LAB",
            "image": "img/news/news001.png",
            "text": "We’re excited to reveal the very first glimpse of Pet.exe’s 2D phase — the initial visual and musical elements that bring our creative experiment to life. To share this exciting milestone, we’re launching our social channels and inviting players and curious minds alike to follow the unfolding of the hybrid horror universe, pixel by pixel, note by note."
        },
        {
            "date": "7 MAY 2025",
            "title": "FIRST FORMULA: READY!",
            "image": "img/news/news002.png",
            "text": "Our first creation is coming to life! We’ve successfully completed the first stage of our development: the game design for Pet.exe is now defined. This hybrid 2D-3D horror game, where a seemingly cute companion slowly reveals its twisted nature, is shaping up to challenge players with suspenseful strategy and emotional depth. The core mechanics and narrative are now reacting together, setting the stage for what’s next. The formula is taking shape, and we’re hard at work refining it every day."
        },
        {
            "date": "12 MARCH 2025",
            "title": "EXPERIMENT BEGINS",
            "image": "img/news/news003.png",
            "text": "Today marks the start of a bold new creative experiment: the birth of our studio. We, Martín and Ariel, joined forces to spark a reaction of ideas. We’re setting out to test a formula that blends genres, fuses aesthetics, and distills the delightful madness of our conversations into something players will experience and enjoy. This is the first step in a chain reaction we’re eager to see unfold."
        }
    ];

    const container = document.getElementById("news-container");

    // Agrupar noticias de 3 en 3 para filas
    for (let i = 0; i < news.length; i += 3) {
        // Crear fila
        const row = document.createElement("div");
        row.className = "row mb-4"; // mb-5 para separar filas
        // Tomar máximo 3 noticias para esta fila
        const newsSlice = news.slice(i, i + 3);
        newsSlice.forEach(item => {
            const col = document.createElement("div");
            col.className = "col-md-4";
            col.innerHTML = `
            <h4>${item.date}</h4>
            <h3 class="subheading">${item.title}</h3>
            <img src="${item.image}" alt="${item.title}" class="news-img mb-3">
            <p class="news-text text-muted">${item.text}</p>
        `;
            row.appendChild(col);
        });
        container.appendChild(row);
    }
</script>
