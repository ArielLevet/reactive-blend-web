<!-- Navigation -->
<nav class="navbar navbar-default navbar-fixed-top">
    <div class="container">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle" data-toggle="collapse"
                data-target="#bs-example-navbar-collapse-1">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <img src="{{ site.baseurl }}/img/icono.png" alt="Logo" class="logo">
            <!--{{ site.title }}-->
        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
            <ul class="nav navbar-nav navbar-right">
                <li class="hidden">
                    <a href="#page-top"></a>
                </li>
                <li>
                    <a class="page-scroll" href="#games">GAMES</a>
                </li>
                <li>
                    <a class="page-scroll" href="#news">NEWS</a>
                </li>
                <li>
                    <a class="page-scroll" href="#studio">STUDIO</a>
                </li>
                <li>
                    <a class="page-scroll" href="#contact">CONTACT / PRESS</a>
                </li>
                <li>
                    <div class="social-buttons">
                        <ul class="list-inline social-buttons">
                            {% for network in site.social %}
                            <li><a href="{{ network.url }}">
                                    <i
                                        class="{% if network.title == 'envelope' %}fas{% else %}fab{% endif %} fa-{{ network.title }}">
                                    </i>
                                </a></li>
                            {% endfor %}
                        </ul>
                    </div>
                </li>
            </ul>
        </div>
        <!-- /.navbar-collapse -->
    </div>
    <!-- /.container-fluid -->
</nav>
